            const formatTime = (decimalHours) => {
                if (!decimalHours || decimalHours < 0) return '0h 00m';
                const hours = Math.floor(decimalHours);
                const minutes = Math.round((decimalHours - hours) * 60);
                return `${hours}h ${minutes.toString().padStart(2, '0')}m`;
            };

            const calculateEmployeeHours = (emp, mode = 'today', startRange = null, endRange = null) => {
                let total = 0;
                const history = emp.history || [];
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
                const yesterdayStr = yesterday.toISOString().split('T')[0];

                if (mode === 'today') {
                    total = history.find(h => h.date === todayStr)?.hours || 0;
                    if (emp.status === 'In' && emp.shiftStartTime) {
                        const sTime = new Date(emp.shiftStartTime);
                        if (!isNaN(sTime.getTime())) total += (now - sTime) / 3600000;
                    }
                } else if (mode === 'yesterday') {
                    total = history.find(h => h.date === yesterdayStr)?.hours || 0;
                } else if (mode === 'custom') {
                    const start = new Date(startRange); const end = new Date(endRange); end.setHours(23, 59, 59);
                    total = history.reduce((sum, h) => { const d = new Date(h.date); return (d >= start && d <= end) ? sum + h.hours : sum; }, 0);
                    if (emp.status === 'In' && emp.shiftStartTime) {
                        const shiftStart = new Date(emp.shiftStartTime);
                        if (!isNaN(shiftStart.getTime())) {
                            if (shiftStart >= start && shiftStart <= end) total += (now - shiftStart) / 3600000;
                        }
                    }
                }
                return total;
            };

            const getDayAbbreviation = (dateStr) => {
                const date = new Date(dateStr);
                const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
                return days[date.getDay()];
            };

            const getDailyCombinedRecords = (emp, start, end) => {
                const rangeShifts = (emp.shifts || []).filter(s => s.date >= start && s.date <= end);
                const shiftDates = new Set(rangeShifts.map(s => s.date));
                const rangeHistory = (emp.history || []).filter(h => h.date >= start && h.date <= end && !shiftDates.has(h.date));

                const dailyMap = {};

                // Process history records
                rangeHistory.forEach(h => {
                    dailyMap[h.date] = {
                        date: h.date,
                        clockIn: '-',
                        clockOut: '-',
                        hours: h.hours,
                        type: 'history'
                    };
                });

                // Process shifts records
                rangeShifts.forEach(s => {
                    if (!dailyMap[s.date]) {
                        dailyMap[s.date] = {
                            date: s.date,
                            clockIns: [],
                            clockOuts: [],
                            hours: 0,
                            type: 'shift'
                        };
                    }
                    dailyMap[s.date].clockIns.push(s.clockIn);
                    dailyMap[s.date].clockOuts.push(s.clockOut);
                    dailyMap[s.date].hours += s.hours;
                });

                // Check active live clock-in
                if (emp.status === 'In' && emp.shiftStartTime) {
                    const shiftStart = new Date(emp.shiftStartTime);
                    if (!isNaN(shiftStart.getTime())) {
                        const shiftStartStr = shiftStart.toISOString().split('T')[0];
                        if (shiftStartStr >= start && shiftStartStr <= end) {
                            const now = new Date();
                            const liveHours = parseFloat(((now - shiftStart) / 3600000).toFixed(2));
                            if (!dailyMap[shiftStartStr]) {
                                dailyMap[shiftStartStr] = {
                                    date: shiftStartStr,
                                    clockIns: [],
                                    clockOuts: [],
                                    hours: 0,
                                    type: 'shift'
                                };
                            }
                            dailyMap[shiftStartStr].clockIns.push(shiftStart.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
                            dailyMap[shiftStartStr].clockOuts.push('Active Now');
                            dailyMap[shiftStartStr].hours += liveHours;
                        }
                    }
                }

                // Process list of days with 1 hour deduction applied
                const sortedDays = Object.keys(dailyMap).sort().map(date => {
                    const dayData = dailyMap[date];
                    let clockInDisplay = dayData.clockIn || '-';
                    let clockOutDisplay = dayData.clockOut || '-';
                    
                    if (dayData.clockIns && dayData.clockIns.length > 0) {
                        clockInDisplay = dayData.clockIns.join(' | ');
                    }
                    if (dayData.clockOuts && dayData.clockOuts.length > 0) {
                        clockOutDisplay = dayData.clockOuts.join(' | ');
                    }

                    const clockedHours = dayData.hours;
                    const paidHours = Math.max(0, clockedHours - 1.0); // Deduct 1 hour (30 min tea + 30 min lunch)

                    return {
                        date,
                        clockIn: clockInDisplay,
                        clockOut: clockOutDisplay,
                        clockedHours,
                        paidHours,
                        type: dayData.type
                    };
                });

                const totalRangeClocked = sortedDays.reduce((sum, d) => sum + d.clockedHours, 0);
                const totalRangePaid = sortedDays.reduce((sum, d) => sum + d.paidHours, 0);

                            history[existingToday] = { ...history[existingToday], hours: history[existingToday].hours + shiftHours };
                        } else {
                            history.push({ date: todayStr, hours: shiftHours });
                        }

                        let shifts = [...(emp.shifts || [])]; 
                        shifts.push({
                            date: todayStr,
                            clockIn: startTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                            clockOut: clockTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                            hours: shiftHours
                        });

                        updateData.shifts = shifts;
                        updateData.todayHours = history.find(h => h.date === todayStr).hours;
                        updateData.weeklyHours = (emp.weeklyHours || 0) + shiftHours;
                        updateData.monthlyHours = (emp.monthlyHours || 0) + shiftHours;
                        updateData.history = history;
                        updateData.shiftStartTime = null;
                    }

                    setEmployees(prev => prev.map(e => e.id === emp.id ? { ...emp, ...updateData } : e));
                    
                    setTimeout(() => { 
                        setView('dashboard'); 
                        setSelectedEmployee(null); 
                        setScanComplete(false); 
                        setPendingAction('normal'); 
                        setTimeOffReason('');
                        setLastClockResult(null); 
                    }, 3500);
                    
                    if (isCloudLive) {
                        await db.collection('artifacts').doc(APP_ID_PATH).collection('public').doc('data').collection('employees').doc(emp.id).update(updateData); 
                    }
                } catch(e) {
                    console.error("Crash prevented in processClockEvent:", e);
                }
            };

            const handleEnrollSubmit = async (e) => {
                e.preventDefault();
                
                const profileData = { 
                    name: enrollForm.name || '',
                    surname: enrollForm.surname || '',
                    address: enrollForm.address || '',
                    idNumber: enrollForm.idNumber || '',
                    taxNumber: enrollForm.taxNumber || '',
                    uifNumber: enrollForm.uifNumber || '',
                    contactNumber: enrollForm.contactNumber || '',
                    personalCode: enrollForm.personalCode || '',
                    dateStarted: enrollForm.dateStarted || '',
                    photo: capturedPhoto || null
                };

                const defaultOperationalState = {
                    status: 'Out', 
                    isArchived: false, 
                    todayHours: 0, 
                    yesterdayHours: 0, 
                    weeklyHours: 0, 
                    monthlyHours: 0, 
                    history: [], 
                    shifts: [], 
                    breaks: []
                };

                const fullCommitObject = isEditing ? profileData : { ...profileData, ...defaultOperationalState };

                // Optimistic Local UI Rendering
                if (isEditing) {
                    setEmployees(prev => prev.map(emp => emp.id === editingId ? { ...emp, ...fullCommitObject } : emp));
                } else {
                    const tempId = 'temp-' + Date.now();
                    setEmployees(prev => [...prev, { id: tempId, ...fullCommitObject }]);
                }

                setShowEnrollModal(false); 
                setIsEditing(false); 
                setEditingId(null);
                setEnrollForm({ name: '', surname: '', address: '', idNumber: '', taxNumber: '', uifNumber: '', contactNumber: '', personalCode: '', dateStarted: '' });
                setCapturedPhoto(null);

                // Safe Cloud Syncing
                if (isCloudLive) {
                    try {
                        if (isEditing && editingId) {
                            await db.collection('artifacts').doc(APP_ID_PATH).collection('public').doc('data').collection('employees').doc(editingId).update(fullCommitObject);
                        } else {
                            await db.collection('artifacts').doc(APP_ID_PATH).collection('public').doc('data').collection('employees').add(fullCommitObject);
                        }
                        announce('Artisan details synchronized securely to cloud database');
                    } catch (err) {
                        console.error("Firestore sync fail on enrollment:", err);
                    }
                } else {
                    announce('Artisan details committed locally');
                }
            };

            const openEditor = (emp) => {
                setEnrollForm({ name: emp.name||'', surname: emp.surname||'', address: emp.address||'', idNumber: emp.idNumber||'', taxNumber: emp.taxNumber||'', uifNumber: emp.uifNumber||'', contactNumber: emp.contactNumber||'', personalCode: emp.personalCode||'', dateStarted: emp.dateStarted||'' });
                setCapturedPhoto(emp.photo||null); setEditingId(emp.id); setIsEditing(true); setShowEnrollModal(true);
            };

            const handleDeleteConfirm = async (e) => {
                e.preventDefault();
                if (superPinInput === SUPER_USER_PIN) {
                    await db.collection('artifacts').doc(APP_ID_PATH).collection('public').doc('data').collection('employees').doc(targetDelete.id).delete();
                    setShowDeleteModal(false); setTargetDelete(null); setSuperPinInput('');
                } else { setSuperPinError(true); setTimeout(() => setSuperPinError(false), 2000); }
            };

            const capturePhoto = () => {
                try {
                    const canvas = canvasRef.current; 
                    const video = videoRef.current;
                    if (video && canvas) {
                        canvas.width = 320; 
                        canvas.height = 240;
                        canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
                        setCapturedPhoto(canvas.toDataURL('image/jpeg', 0.6)); 
                        setIsCapturing(false);
                        if (streamRef.current) { 
                            streamRef.current.getTracks().forEach(t => t.stop()); 
                            streamRef.current = null; 
                        }
                    }
                } catch (e) {
                    console.warn("Capture operation failed:", e);
                }
            };

            // ==========================================
            // APP RENDER UI
            // ==========================================
            const hideTaskbar = ['scanning', 'personal_pin_entry', 'supervisor_approval', 'emp_archive_reason', 'success_screen', 'emp_time_off', 'emp_money_borrowed'].includes(view);

            return (
                <Fragment>
                {/* --- MAIN APP --- */}
                <div className={`h-screen w-full bg-transparent flex flex-col relative overflow-hidden text-white italic ${isExportingPDF || printingCard ? 'hidden no-print' : ''}`}>
                    {/* Background Watermark Element */}
                    <div className="bg-watermark"></div>
                    
                    <canvas ref={canvasRef} className="hidden" />
                    
                    <header className="px-8 py-5 border-b border-white/10 bg-[#0c0c0c]/80 backdrop-blur-2xl sticky top-0 z-50 flex justify-between items-center">
                        <div className="flex items-center space-x-5">
                            <div className="p-3 rounded-2xl bg-[#ff8c00]/10 text-[#ff8c00] shadow-[0_0_20px_rgba(255,140,0,0.15)]"><Icon name="hard-hat" size={28} /></div>
                            <div>
                                <h1 className="text-2xl font-black italic tracking-tighter uppercase leading-none text-white font-sans">TimberSmith <span className="text-[#ff8c00]">Joinery</span></h1>
                                <div className="flex items-center gap-2 mt-1.5 font-sans">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <p className="text-[10px] font-black uppercase tracking-[0.2em] text-gray-400">System Online</p>
                                </div>
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-8 font-sans">
                            <div className="text-right flex flex-col justify-center">
                                <p className="text-2xl font-mono font-black leading-none text-white tracking-tight">{currentTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</p>
                                <p className="text-[10px] font-black text-gray-500 uppercase mt-1.5 tracking-widest">{currentTime.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' })}</p>
                            </div>
                            
                            <div className="w-px h-10 bg-white/10 mx-2"></div>
                            
                            <div className="flex items-center gap-4">
                                <button className="relative p-3 rounded-xl bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white transition-all">
                                    <Icon name="bell" size={20} />
                                    <span className="absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-[#0c0c0c]"></span>
                                </button>
                                <button onClick={() => { setAppMode('settings'); setShowPinModal(true); }} className="p-3 rounded-xl bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white transition-all">
                                    <Icon name="settings" size={20} />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* NEW PORTAL GRID SYSTEM WITH LEFT SIDEBAR */}
                    <div className="flex-1 flex overflow-hidden">
                        
                        {/* LEFT SIDEBAR NAVIGATION */}
                        <aside className="w-80 bg-black/60 backdrop-blur-2xl border-r border-white/10 p-6 flex flex-col justify-between h-full shrink-0">
                            <div className="space-y-8 font-sans">
                                <div>
                                    <p className="text-[10px] font-black uppercase text-gray-500 tracking-[0.2em] mb-4 font-sans">Artisan Terminal</p>
                                    <button 
                                        onClick={() => { setAppMode('employee'); setView('dashboard'); setSelectedEmployee(null); }} 
                                        className={`w-full flex items-center space-x-4 p-4 rounded-2xl transition-all ${appMode === 'employee' ? 'bg-[#ff8c00]/10 border border-[#ff8c00]/30 text-[#ff8c00]' : 'hover:bg-white/5 text-gray-400 hover:text-white'}`}
                                    >
                                        <Icon name="clock" size={20} />
                                        <span className="font-black uppercase text-xs tracking-wider">Clocking Terminal</span>
                                    </button>
                                </div>

                                <div>
                                    <div className="flex justify-between items-center mb-4">
                                        <p className="text-[10px] font-black uppercase text-gray-500 tracking-[0.2em] font-sans">Management Hub</p>
                                        {isLocked && <span className="p-1 bg-red-500/10 text-red-500 border border-red-500/20 rounded text-[8px] font-bold uppercase tracking-widest font-sans">Locked</span>}
                                    </div>
                                    <div className="space-y-2">
                                        <button 
                                            disabled={isLocked}
                                            onClick={() => { setAppMode('kanban'); setView('dashboard'); }} 
                                            className={`w-full flex items-center space-x-4 p-4 rounded-2xl transition-all ${isLocked ? 'opacity-40 cursor-not-allowed' : ''} ${appMode === 'kanban' ? 'bg-blue-600/10 border border-blue-500/30 text-blue-500' : 'hover:bg-white/5 text-gray-400 hover:text-white'}`}
                                        >
                                            <Icon name="kanban" size={20} />
                                            <span className="font-black uppercase text-xs tracking-wider">Kanban Creator</span>
                                        </button>

                                        <button 
                                            disabled={isLocked}
                                            onClick={() => { setAppMode('orders'); setActiveCategory('red'); }} 
                                            className={`w-full flex items-center space-x-4 p-4 rounded-2xl transition-all ${isLocked ? 'opacity-40 cursor-not-allowed' : ''} ${appMode === 'orders' ? 'bg-[#ff8c00]/10 border border-[#ff8c00]/30 text-[#ff8c00]' : 'hover:bg-white/5 text-gray-400 hover:text-white'}`}
                                        >
                                            <Icon name="banknote" size={20} />
                                            <span className="font-black uppercase text-xs tracking-wider">Order Management</span>
                                        </button>

                                        <button 
                                            disabled={isLocked}
                                            onClick={() => { setAppMode('admin'); setView('dashboard'); }} 
                                            className={`w-full flex items-center space-x-4 p-4 rounded-2xl transition-all ${isLocked ? 'opacity-40 cursor-not-allowed' : ''} ${appMode === 'admin' ? 'bg-blue-600/10 border border-blue-500/30 text-blue-500' : 'hover:bg-white/5 text-gray-400 hover:text-white'}`}
                                        >
                                            <Icon name="users" size={20} />
                                            <span className="font-black uppercase text-xs tracking-wider">Employer Registration</span>
                                        </button>

                                        <button 
                                            disabled={isLocked}
                                            onClick={() => { setAppMode('analytics'); setView('dashboard'); }} 
                                            className={`w-full flex items-center space-x-4 p-4 rounded-2xl transition-all ${isLocked ? 'opacity-40 cursor-not-allowed' : ''} ${appMode === 'analytics' ? 'bg-emerald-600/10 border border-emerald-500/30 text-emerald-500' : 'hover:bg-white/5 text-gray-400 hover:text-white'}`}
                                        >
                                            <Icon name="bar-chart-3" size={20} />
                                            <span className="font-black uppercase text-xs tracking-wider">Work Analytics</span>
                                        </button>

                                        <button 
                                            disabled={isLocked}
                                            onClick={() => setAppMode('mobile')} 
                                            className={`w-full flex items-center space-x-4 p-4 rounded-2xl transition-all ${isLocked ? 'opacity-40 cursor-not-allowed' : ''} ${appMode === 'mobile' ? 'bg-pink-600/10 border border-pink-500/30 text-pink-500' : 'hover:bg-white/5 text-gray-400 hover:text-white'}`}
                                        >
                                            <Icon name="smartphone" size={20} />
                                            <span className="font-black uppercase text-xs tracking-wider">Mobile Deployment</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Secure authentication unlock pad built on bottom of sidebar */}
                            <div className="border-t border-white/10 pt-6 font-sans">
                                {isLocked ? (
                                    <button 
                                        onClick={() => setShowPinModal(true)} 
                                        className="w-full py-4 bg-[#ff8c00] hover:bg-[#e07b00] rounded-2xl text-xs font-black uppercase tracking-widest text-white shadow-lg active:scale-95 transition-all flex items-center justify-center space-x-3"
                                    >
                                        <Icon name="lock" size={16} />
                                        <span>Unlock Portal</span>
                                    </button>
                                ) : (
                                    <button 
                                        onClick={() => { setIsLocked(true); setAppMode('home'); }} 
                                        className="w-full py-4 bg-red-600/10 border border-red-500/30 hover:bg-red-600/20 rounded-2xl text-xs font-black uppercase tracking-widest text-red-500 transition-all flex items-center justify-center space-x-3"
                                    >
                                        <Icon name="unlock" size={16} />
                                        <span>Lock Terminal</span>
                                    </button>
                                )}
                            </div>
                        </aside>

                        {/* WORKSPACE PORTAL CONTAINER */}
                        <div className="flex-1 overflow-y-auto p-12 custom-scrollbar pb-36 relative">
                            
                            {/* HOME SECURE LOGIN PORTAL */}
                            {appMode === 'home' && (
                                <div className="max-w-xl mx-auto py-12">
                                    <div className="bg-[#151515]/90 border border-white/10 p-10 rounded-[3rem] shadow-2xl backdrop-blur-3xl text-center">
                                        <div className="w-20 h-20 bg-[#ff8c00]/10 text-[#ff8c00] rounded-3xl flex items-center justify-center mx-auto mb-6">
                                            <Icon name="lock" size={40} />
                                        </div>
                                        <h2 className="text-3xl font-black uppercase tracking-tight text-white mb-2">Management Portal</h2>
                                        <p className="text-xs text-gray-500 uppercase tracking-widest mb-10">Sign in to unlock operational departments</p>

                                        <form onSubmit={handleAuthSubmit} className="space-y-6 text-left font-sans">
                                            {authView === 'register' && (
                                                <div>
                                                    <label className="text-[10px] font-black uppercase text-gray-500 ml-3 italic font-sans font-bold">Full Name</label>
                                                    <input required className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 text-white mt-1.5 outline-none focus:border-blue-500 font-bold" value={authForm.name} onChange={e => setAuthForm({...authForm, name: e.target.value})} placeholder="E.g. Workshop Manager" />
                                                </div>
                                            )}
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-gray-500 ml-3 italic font-sans font-bold">Email Address</label>
                                                <input required type="email" className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 text-white mt-1.5 outline-none focus:border-blue-500 font-bold" value={authForm.email} onChange={e => setAuthForm({...authForm, email: e.target.value})} placeholder="manager@tsjoinery.co.za" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-gray-500 ml-3 italic font-sans font-bold">Security Key / PIN</label>
                                                <input required type="password" className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 text-white mt-1.5 outline-none focus:border-blue-500 text-center tracking-[0.5em] text-xl font-bold font-sans" value={authForm.pin} onChange={e => setAuthForm({...authForm, pin: e.target.value})} placeholder="••••" />
                                            </div>

                                            {authView === 'register' && (
                                                <div>
                                                    <label className="text-[10px] font-black uppercase text-gray-500 ml-3 italic font-sans font-bold">Desired Access Role</label>
                                                    <select className="w-full bg-black border border-white/10 rounded-2xl p-4 text-white mt-1.5 outline-none focus:border-blue-500 appearance-none cursor-pointer" value={authForm.role} onChange={e => setAuthForm({...authForm, role: e.target.value})}>
                                                        <option value="Artisan">Artisan (Clock Only)</option>
                                                        <option value="HR">HR Controller</option>
                                                        <option value="Supervisor">Supervisor</option>
                                                        <option value="Admin">System Administrator</option>
                                                    </select>
                                                </div>
                                            )}

                                            <button type="submit" className="w-full py-5 bg-[#ff8c00] hover:bg-[#e07b00] text-white rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl transition-colors mt-8 font-sans">
                                                {authView === 'login' ? 'Authenticate Login' : 'Request Registry Access'}
                                            </button>
                                        </form>

                                        <div className="mt-8 border-t border-white/5 pt-6 flex justify-between text-[11px] font-bold uppercase text-gray-500 font-sans">
                                            {authView === 'login' ? (
                                                <button onClick={() => setAuthView('register')} className="hover:text-white transition-colors">Request Access</button>
                                            ) : (
                                                <button onClick={() => setAppMode('employee')} className="hover:text-white transition-colors">Back to Login</button>
                                            )}
                                            <button onClick={() => setShowPinModal(true)} className="text-[#ff8c00] hover:text-[#e07b00]">Master supervisor bypass</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 1. Main Artisan Selection Dashboard */}
                            {appMode === 'employee' && view === 'dashboard' && (
                                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-8 animate-in fade-in font-sans">
                                    {employees.filter(emp => !emp.isArchived).map(emp => (
                                        <div key={emp.id} onClick={() => { setSelectedEmployee(emp); setPendingAction('hub_login'); setView('personal_pin_entry'); }} className="bg-[#151515]/90 backdrop-blur-xl p-6 rounded-[3rem] border border-white/5 flex flex-col items-center cursor-pointer shadow-2xl hover:border-[#ff8c00] transition-all group active:scale-95 font-sans">
                                            <div className="relative mb-6">
                                                <PhotoAvatar emp={emp} size={110} className="group-hover:scale-105 transition-transform duration-500" />
                                                <div className={`absolute -bottom-1 -right-1 w-8 h-8 rounded-full border-[6px] border-[#151515] ${emp.status === 'In' ? 'bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.5)] animate-pulse' : emp.status === 'Break' ? 'bg-purple-500 shadow-[0_0_15px_rgba(168,85,247,0.5)]' : 'bg-red-500 shadow-md'}`} />
                                            </div>
                                            <p className="font-black text-sm uppercase italic tracking-tighter text-center leading-none text-white">{emp.name} {emp.surname}</p>
                                            <p className="text-[9px] text-gray-600 mt-3 font-black uppercase tracking-widest">{emp.role}</p>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* 5. EMPLOYEE PRIVATE HUB */}
                            {view === 'emp_home' && selectedEmployee && (
                               <div className="max-w-5xl mx-auto p-12 bg-[#1a1a1a]/90 backdrop-blur-2xl rounded-[5rem] border border-white/5 shadow-2xl animate-in slide-in-from-bottom-20 duration-500 font-sans">
                                   <div className="flex items-center gap-10 mb-16">
                                       <PhotoAvatar emp={selectedEmployee} size={160} className="border-4 border-[#ff8c00] shadow-2xl shadow-black/80" />
                                       <div className="flex-1">
                                           <h2 className="text-6xl font-black uppercase italic tracking-tighter leading-none italic text-white">{selectedEmployee.name} {selectedEmployee.surname}</h2>
                                           <p className="text-2xl font-black text-gray-500 uppercase tracking-[0.4em] mt-4 italic">{selectedEmployee.role}</p>
                                       </div>
                                       <button type="button" onClick={() => setView('dashboard')} className="p-6 bg-white/5 rounded-full text-gray-500 hover:text-white transition-all active:scale-90"><Icon name="x" size={40}/></button>
                                   </div>
                                   <div className="grid grid-cols-1 md:grid-cols-3 gap-10">
                                       <button type="button" onClick={() => { setView('scanning'); setPendingAction('normal'); }} className="bg-black/60 p-10 rounded-[4rem] flex flex-col items-center justify-center gap-6 border-2 border-transparent hover:border-[#ff8c00] transition-all group active:scale-95 shadow-xl">
                                           <div className="p-8 bg-[#ff8c00]/10 text-[#ff8c00] rounded-[2.5rem] transition-transform group-hover:scale-110"><Icon name="clock" size={60} /></div>
                                           <span className="font-black uppercase italic text-xl tracking-widest text-white font-sans">Clocking</span>
                                       </button>
                                       <button type="button" onClick={() => { setView('emp_time_off'); setTimeOffReason(''); setPendingAction('normal'); }} className="bg-black/60 p-10 rounded-[4rem] flex flex-col items-center justify-center gap-6 border-2 border-transparent hover:border-purple-500 transition-all group active:scale-95 shadow-xl">
                                           <div className="p-8 bg-purple-500/10 text-purple-400 rounded-[2.5rem] transition-transform group-hover:scale-110"><Icon name="plane-takeoff" size={60} /></div>
                                           <span className="font-black uppercase italic text-xl tracking-widest text-white font-sans font-bold font-sans font-sans font-bold">Time Off</span>
                                       </button>
                                       <button type="button" onClick={() => { setView('emp_money_borrowed'); setBorrowAmount(''); setBorrowReason(''); setBorrowMethod(''); setBorrowMonths('1'); setCapturedBorrowPhoto(null); setPendingAction('normal'); }} className="bg-black/60 p-10 rounded-[4rem] flex flex-col items-center justify-center gap-6 border-2 border-transparent hover:border-[#ff8c00] transition-all group active:scale-95 shadow-xl">
                                           <div className="p-8 bg-emerald-500/10 text-[#ff8c00] rounded-[2.5rem] transition-transform group-hover:scale-110"><Icon name="banknote" size={60} /></div>
                                           <span className="font-black uppercase italic text-xl tracking-widest text-white text-center font-sans font-bold font-sans font-bold">Money Borrowed</span>
                                       </button>
                                   </div>
                               </div>
                            )}

                            {/* VIEW: EMPLOYEE TIME OFF FORM */}
                            {view === 'emp_time_off' && selectedEmployee && (
                                <div className="max-w-2xl mx-auto p-10 bg-[#151515]/95 border border-white/10 rounded-[3rem] shadow-2xl backdrop-blur-3xl animate-in fade-in duration-300 font-sans">
                                    <div className="flex items-center space-x-4 mb-8">
                                        <PhotoAvatar emp={selectedEmployee} size={70} />
                                        <div>
                                            <h3 className="text-2xl font-black uppercase text-white font-sans font-bold">Request Time Off</h3>
                                            <p className="text-xs text-gray-500 font-sans uppercase font-bold">Artisan: {selectedEmployee.name} {selectedEmployee.surname}</p>
                                        </div>
                                    </div>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        setPendingAction('time_off_out');
                                        setView('supervisor_approval');
                                    }} className="space-y-6">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-gray-500 ml-4 italic font-sans font-bold">Reason for Time Off</label>
                                            <textarea 
                                                required 
                                                className="w-full bg-black/40 border border-white/10 rounded-2xl p-4 font-bold outline-none focus:border-[#ff8c00] text-white mt-1.5 resize-none h-32 font-sans" 
                                                value={timeOffReason} 
                                                onChange={(e) => setTimeOffReason(e.target.value)} 
                                                placeholder="Explain details..."
                                            />
                                        </div>
                                        <div className="flex gap-4 pt-4">
                                            <button type="button" onClick={() => setView('emp_home')} className="flex-1 py-5 bg-white/5 border border-white/10 rounded-2xl font-black uppercase text-[11px] tracking-widest hover:bg-white/10 transition-all font-sans">Back</button>
                                            <button type="submit" className="flex-1 py-5 bg-purple-600 hover:bg-purple-500 text-white rounded-2xl font-black uppercase text-[11px] tracking-widest shadow-xl transition-all font-sans">Request Approval</button>
                                        </div>
                                    </form>
                                </div>
                            )}

                            {/* VIEW: EMPLOYEE MONEY BORROWED / CASH ADVANCE REQUEST */}
                            {view === 'emp_money_borrowed' && selectedEmployee && (
                                <div className="max-w-2xl mx-auto p-10 bg-[#151515]/95 border border-white/10 rounded-[3rem] shadow-2xl backdrop-blur-3xl animate-in fade-in duration-300 font-sans">
                                    <div className="flex items-center space-x-4 mb-8">
                                        <PhotoAvatar emp={selectedEmployee} size={70} />
                                        <div>
                                            <h3 className="text-2xl font-black uppercase text-white font-sans font-bold">Secure Cash Advance</h3>
                                            <p className="text-xs text-gray-500 font-sans uppercase font-bold">Artisan: {selectedEmployee.name} {selectedEmployee.surname}</p>
                                        </div>
                                    </div>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        setPendingAction('borrow_money');
                                        setView('supervisor_approval');
                                    }} className="space-y-6">
                                        <div className="grid grid-cols-2 gap-6">
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-gray-500 ml-4 italic font-sans font-bold">Borrow Amount (Rands)</label>
                                                <input 
                                                    required 
                                                    type="number" 
                                                    min="10" 
                                                    max="5000"
                                                    className="w-full bg-black/40 border border-white/10 rounded-2xl p-4 font-bold outline-none focus:border-emerald-500 text-white mt-1.5 font-sans" 
                                                    value={borrowAmount} 
                                                    onChange={(e) => setBorrowAmount(e.target.value)} 
                                                    placeholder="E.g. 500"
                                                />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-gray-500 ml-4 italic font-sans font-bold">Repayment Terms</label>
                                                <select 
                                                    required 
                                                    className="w-full bg-[#151515] border border-white/10 rounded-2xl p-4 font-bold outline-none focus:border-emerald-500 text-white mt-1.5 font-sans cursor-pointer appearance-none" 
                                                    value={borrowMonths} 
                                                    onChange={(e) => setBorrowMonths(e.target.value)}
                                                >
                                                    <option value="1">1 Month (Immediate)</option>
                                                    <option value="2">2 Months (Installments)</option>
                                                    <option value="3">3 Months (Installments)</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-6">
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-gray-500 ml-4 italic font-sans font-bold">Payment Method</label>
                                                <select 
                                                    required 
                                                    className="w-full bg-[#151515] border border-white/10 rounded-2xl p-4 font-bold outline-none focus:border-emerald-500 text-white mt-1.5 font-sans cursor-pointer appearance-none" 
                                                    value={borrowMethod} 
                                                    onChange={(e) => setBorrowMethod(e.target.value)}
                                                >
                                                    <option value="">Select Method...</option>
                                                    <option value="Cash">Cash Handout</option>
                                                    <option value="Standard Payroll">Standard Payroll pay date</option>
                                                    <option value="Immediate Payment">Immediate EFT Payment (+R75 Fee)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-gray-500 ml-4 italic font-sans font-bold">Reason for Advance</label>
                                                <input 
                                                    required 
                                                    className="w-full bg-black/40 border border-white/10 rounded-2xl p-4 font-bold outline-none focus:border-emerald-500 text-white mt-1.5 font-sans" 
                                                    value={borrowReason} 
                                                    onChange={(e) => setBorrowReason(e.target.value)} 
                                                    placeholder="E.g. Transport, Tooling"
                                                />
                                            </div>
                                        </div>
                                        
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-gray-500 ml-4 italic font-sans font-bold">Photo Verification Check</label>
                                            <div className="mt-2 flex items-center gap-4">
                                                <div className="w-24 h-24 bg-black/50 border border-white/10 rounded-2xl overflow-hidden flex items-center justify-center">
                                                    {capturedBorrowPhoto ? <img src={capturedBorrowPhoto} className="w-full h-full object-cover" /> : <Icon name="camera" size={24} className="text-gray-600"/>}
                                                </div>
                                                <div className="flex gap-2">
                                                    <button 
                                                        type="button" 
                                                        onClick={() => {
                                                            setIsBorrowCapturing(true);
                                                            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                                                                .then(s => {
                                                                    streamRef.current = s;
                                                                    if (videoRef.current) {
                                                                        videoRef.current.srcObject = s;
                                                                        videoRef.current.play();
                                                                    }
                                                                })
                                                                .catch(err => console.warn("Camera failed: ", err));
                                                        }} 
                                                        className="px-4 py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl font-sans text-xs uppercase font-bold"
                                                    >
                                                        Snap Photo
                                                    </button>
                                                    {isBorrowCapturing && (
                                                        <button 
                                                            type="button" 
                                                            onClick={() => {
                                                                const canvas = canvasRef.current;
                                                                const video = videoRef.current;
                                                                if (video && canvas) {
                                                                    canvas.width = 320;
                                                                    canvas.height = 240;
                                                                    canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
                                                                    setCapturedBorrowPhoto(canvas.toDataURL('image/jpeg', 0.6));
                                                                    setIsBorrowCapturing(false);
                                                                    if (streamRef.current) {
                                                                        streamRef.current.getTracks().forEach(t => t.stop());
                                                                        streamRef.current = null;
                                                                    }
                                                                }
                                                            }} 
                                                            className="p-3 bg-emerald-600 rounded-xl"
                                                        >
                                                            <Icon name="camera" size={16}/>
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex gap-4 pt-4">
                                            <button type="button" onClick={() => setView('emp_home')} className="flex-1 py-5 bg-white/5 border border-white/10 rounded-2xl font-black uppercase text-[11px] tracking-widest hover:bg-white/10 transition-all font-sans">Back</button>
                                            <button type="submit" className="flex-1 py-5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-black uppercase text-[11px] tracking-widest shadow-xl transition-all font-sans">Request Approval</button>
                                        </div>
                                    </form>
                                </div>
                            )}

                            {/* 0.5 NEW KANBAN BOARD SCREEN */}
                            {appMode === 'kanban' && (
                                <div className="animate-in fade-in duration-500 h-full flex flex-col font-sans">
                                    <div className="flex justify-between items-center mb-8 border-b border-white/10 pb-6">
                                        <div>
                                            <h2 className="text-3xl font-black uppercase italic tracking-tighter text-white font-sans">Kanban Cards Creator</h2>
                                            <p className="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500 mt-1 font-sans">Active Production Kanbans</p>
                                        </div>
                                        <button type="button" onClick={() => openCardEditor()} className="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black uppercase text-[11px] tracking-widest shadow-xl flex items-center space-x-3 active:scale-95 transition-all">
                                            <Icon name="user-plus" size={18} /><span>Create Kanban</span>
                                        </button>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 flex-1 content-start animate-in fade-in font-sans">
                                        {kanbanCards.map(card => (
                                            <div key={card.id} className="bg-[#151515]/90 backdrop-blur-xl p-6 rounded-[2.5rem] border border-white/5 flex flex-col shadow-2xl relative group hover:border-blue-500/50 transition-all font-sans" style={{ borderLeftColor: card.color || '#3b82f6', borderLeftWidth: '4px' }}>
                                                <div className="flex gap-4">
                                                    <div className="w-24 h-24 rounded-2xl bg-black/50 border border-white/10 overflow-hidden flex-shrink-0">
                                                        {card.photo ? <img src={card.photo} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-gray-600"><Icon name="camera" size={24}/></div>}
                                                    </div>
                                                    <div className="flex-1">
                                                        <h4 className="font-black text-white uppercase italic text-lg leading-tight line-clamp-2">{card.title}</h4>
                                                        <p className="text-xs text-blue-500 mt-1 font-bold">P/N: {card.supplierPartNo}</p>
                                                        <p className="text-[10px] text-gray-500 font-bold mt-1 uppercase tracking-widest font-sans">Loc: {card.location}</p>
                                                    </div>
                                                </div>
                                                <div className="mt-6 pt-4 border-t border-white/10 flex justify-between">
                                                    <button type="button" onClick={() => handlePrintKanban(card)} className="px-4 py-2 bg-white/5 hover:bg-white/10 text-white rounded-xl text-xs font-black uppercase tracking-widest transition-all flex items-center gap-2 font-sans"><Icon name="printer" size={14}/> Print Card</button>
                                                    <div className="flex gap-2">
                                                        <button type="button" onClick={() => openCardEditor(card)} className="p-2 text-gray-500 hover:text-blue-500 transition-colors"><Icon name="edit-3" size={18}/></button>
                                                        <button type="button" onClick={() => { if(confirm('Delete this Kanban?')) { if(isCloudLive) db.collection('artifacts').doc(APP_ID_PATH).collection('public').doc('data').collection('kanban').doc(card.id).delete(); else setKanbanCards(prev => prev.filter(c => c.id !== card.id)); } }} className="p-2 text-gray-500 hover:text-red-500 transition-colors"><Icon name="trash-2" size={18}/></button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Kanban Card Editor Modal */}
                            {showCardEditor && (
                                <div className="fixed inset-0 z-[1000] bg-black/95 backdrop-blur-3xl flex items-center justify-center p-8 animate-in fade-in overflow-y-auto">
                                    <div className="bg-[#151515] w-full max-w-4xl rounded-[4rem] border border-white/10 shadow-2xl p-10 my-8">
                                        <div className="flex justify-between items-center mb-8">
                                            <h2 className="text-2xl font-black uppercase italic tracking-tighter text-white font-sans">{kanbanEditingId ? 'Edit Kanban Card' : 'Create Kanban Card'}</h2>
                                            <button type="button" onClick={() => setShowCardEditor(false)} className="p-3 text-gray-500 hover:text-white transition-all"><Icon name="x" size={24}/></button>
                                        </div>
                                        <form onSubmit={handleSaveCard} className="grid grid-cols-1 md:grid-cols-2 gap-8 font-sans">
                                            <div className="space-y-6">
                                                <div>
                                                    <label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic">Card Title / Header</label>
                                                    <input required className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 transition-all text-white mt-1" value={cardForm.title} onChange={e => setCardForm({...cardForm, title: e.target.value})} placeholder="E.g., LAMINATING POUCH" />
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic">Location</label>
                                                        <input required className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 transition-all text-white mt-1" value={cardForm.location} onChange={e => setCardForm({...cardForm, location: e.target.value})} placeholder="STATIONERY" />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic">Supplier P/No.</label>
                                                        <input required className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 transition-all text-white mt-1" value={cardForm.supplierPartNo} onChange={e => setCardForm({...cardForm, supplierPartNo: e.target.value})} placeholder="IBC10" />
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic">Supplier</label>
                                                        <input required className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 transition-all text-white mt-1" value={cardForm.supplier} onChange={e => setCardForm({...cardForm, supplier: e.target.value})} placeholder="AMAZON" />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic">Order Qty</label>
                                                        <input required className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 transition-all text-white mt-1" value={cardForm.orderQty} onChange={e => setCardForm({...cardForm, orderQty: e.target.value})} placeholder="100 IN BOX" />
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic">Delivery Time</label>
                                                        <input required className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 transition-all text-white mt-1" value={cardForm.deliveryTime} onChange={e => setCardForm({...cardForm, deliveryTime: e.target.value})} placeholder="NEXT DAY" />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic">Contact Details</label>
                                                        <input className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 transition-all text-white mt-1" value={cardForm.contactDetails} onChange={e => setCardForm({...cardForm, contactDetails: e.target.value})} placeholder="Re-order 2 / Other..." />
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="space-y-6">
                                                <div>
                                                    <label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic">Product Photo</label>
                                                    <div className="mt-1 flex items-center gap-4">
                                                        <div className="w-32 h-32 bg-black/50 border border-white/10 rounded-2xl overflow-hidden flex items-center justify-center">
                                                            {cardForm.photo ? <img src={cardForm.photo} className="w-full h-full object-cover" /> : <Icon name="camera" size={32} className="text-gray-600"/>}
                                                        </div>
                                                        <label className="px-6 py-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl cursor-pointer font-black text-xs uppercase tracking-widest transition-colors shadow-lg font-sans">
                                                            Upload Image
                                                            <input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} />
                                                        </label>
                                                    </div>
                                                </div>
                                                
                                                {/* Customization Section */}
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-white/10 pt-6 mt-6 font-sans">
                                                    <div>
                                                        <label className="text-[10px] font-black uppercase text-gray-600 ml-2 italic">Theme Color</label>
                                                        <div className="flex items-center gap-3 mt-1">
                                                            <input type="color" className="w-14 h-14 bg-black/40 border border-white/5 rounded-2xl p-1 cursor-pointer" value={cardForm.color || '#d9ead3'} onChange={e => setCardForm({...cardForm, color: e.target.value})} />
                                                            <span className="text-xs font-mono font-bold text-gray-400">{cardForm.color || '#d9ead3'}</span>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-black uppercase text-gray-600 ml-2 italic">Print Width (px)</label>
                                                        <input type="number" className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 transition-all text-white mt-1" value={cardForm.width || '800'} onChange={e => setCardForm({...cardForm, width: e.target.value})} placeholder="800" />
                                                    </div>
                                                </div>

                                                <button type="submit" className="w-full mt-4 py-6 bg-blue-600 hover:bg-blue-500 text-white rounded-3xl font-black uppercase tracking-[0.2em] text-sm shadow-xl active:scale-95 transition-all font-sans">Save Kanban Card</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            )}

                            {/* ORDER MANAGEMENT COMPONENT VIEW */}
                            {appMode === 'orders' && (
                                <div className="animate-in fade-in duration-500 h-full flex flex-col font-sans">
                                    <div className="flex justify-between items-center mb-8 border-b border-white/10 pb-6">
                                        <div>
                                            <h2 className="text-3xl font-black uppercase italic tracking-tighter text-white font-sans">Order Management Node</h2>
                                            <p className="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500 mt-1 font-sans">Real-time status boards</p>
                                        </div>
                                        <button onClick={() => setShowOrderModal(true)} className="bg-[#ff8c00] text-white px-8 py-4 rounded-2xl font-black uppercase text-[11px] tracking-widest shadow-xl flex items-center space-x-3 active:scale-95 transition-all">
                                            <Icon name="user-plus" size={18} /><span>Log Item / Issue</span>
                                        </button>
                                    </div>

                                    {/* 4 Colored selection tabs */}
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-6 mb-12">
                                        <button onClick={() => setActiveCategory('red')} className={`p-6 rounded-[2rem] border-2 text-center transition-all ${activeCategory === 'red' ? 'bg-red-50/20 border-red-500 text-red-500 shadow-2xl' : 'bg-[#151515]/90 border-white/5 text-gray-400'}`}>
                                            <p className="font-black uppercase text-sm italic tracking-tight">Purchase Orders</p>
                                            <p className="text-[9px] font-bold uppercase tracking-widest mt-1 opacity-70">Not Arrived Yet</p>
                                        </button>
                                        <button onClick={() => setActiveCategory('yellow')} className={`p-6 rounded-[2rem] border-2 text-center transition-all ${activeCategory === 'yellow' ? 'bg-[#ff8c00]/20 border-orange-500 text-orange-400 shadow-2xl' : 'bg-[#151515]/90 border-white/5 text-gray-400'}`}>
                                            <p className="font-black uppercase text-sm italic tracking-tight">Incomplete</p>
                                            <p className="text-[9px] font-bold uppercase tracking-widest mt-1 opacity-70 font-sans">Invoices / Delivery</p>
                                        </button>
                                        <button onClick={() => setActiveCategory('green')} className={`p-6 rounded-[2rem] border-2 text-center transition-all ${activeCategory === 'green' ? 'bg-[#10b981]/20 border-emerald-500 text-emerald-400 shadow-2xl' : 'bg-[#151515]/90 border-white/5 text-gray-400'}`}>
                                            <p className="font-black uppercase text-sm italic tracking-tight">Deliveries Correct</p>
                                            <p className="text-[9px] font-bold uppercase tracking-widest mt-1 opacity-70 font-sans">Purchase Orders Check</p>
                                        </button>
                                        <button onClick={() => setActiveCategory('orange')} className={`p-6 rounded-[2rem] border-2 text-center transition-all ${activeCategory === 'orange' ? 'bg-red-500/20 border-red-500 text-red-500 shadow-2xl' : 'bg-[#151515]/90 border-white/5 text-gray-400'}`}>
                                            <p className="font-black uppercase text-sm italic tracking-tight font-sans">Returns</p>
                                            <p className="text-[9px] font-bold uppercase tracking-widest mt-1 opacity-70 font-sans font-bold">To Be Returned</p>
                                        </button>
                                    </div>

                                    {/* Active Category Display Items */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 font-sans">
                                        {orderItems.map(item => (
                                            <div key={item.id} className="bg-[#151515]/90 backdrop-blur-xl p-6 rounded-[2.5rem] border border-white/10 flex flex-col shadow-2xl relative">
                                                <div className="flex gap-4">
                                                    <div className="w-20 h-20 rounded-2xl bg-black/40 overflow-hidden flex-shrink-0">
                                                        {item.photo ? <img src={item.photo} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-gray-600"><Icon name="camera" size={24}/></div>}
                                                    </div>
                                                    <div>
                                                        <h4 className="font-black text-white uppercase italic text-lg leading-tight font-sans">{item.title}</h4>
                                                        <p className="text-xs text-gray-500 mt-2 font-bold leading-relaxed">{item.notes}</p>
                                                    </div>
                                                </div>
                                                <div className="mt-6 pt-4 border-t border-white/5 flex justify-between items-center text-[10px] text-gray-500 font-bold uppercase font-sans">
                                                    <span>Logged: {new Date(item.createdAt).toLocaleDateString()}</span>
                                                    <button onClick={async () => {
                                                        if (confirm("Delete this registry entry?")) {
                                                            if (isCloudLive) await db.collection('artifacts').doc(APP_ID_PATH).collection('public').doc('data').collection('orders').doc(item.id).delete();
                                                            else setOrderItems(prev => prev.filter(o => o.id !== item.id));
                                                        }
                                                    }} className="text-red-500 hover:text-red-400"><Icon name="trash-2" size={14}/></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Create Order Item Modal */}
                                    {showOrderModal && (
                                        <div className="fixed inset-0 z-[1000] bg-black/95 backdrop-blur-3xl flex items-center justify-center p-8 animate-in fade-in overflow-y-auto font-sans">
                                            <div className="bg-[#151515] w-full max-w-lg rounded-[4rem] border border-white/10 shadow-2xl p-10 my-8 font-sans">
                                                <div className="flex justify-between items-center mb-8 font-sans font-sans">
                                                    <h2 className="text-2xl font-black uppercase italic tracking-tighter text-white font-sans">Log Category Item</h2>
                                                    <button onClick={() => setShowOrderModal(false)} className="p-3 text-gray-500 hover:text-white transition-all"><Icon name="x" size={24}/></button>
                                                </div>
                                                <form onSubmit={handleSaveOrder} className="space-y-6 font-sans">
                                                    <div>
                                                        <label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic font-sans">Item Name / ID</label>
                                                        <input required autoFocus className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 transition-all text-white mt-1" value={orderForm.title} onChange={e => setOrderForm({...orderForm, title: e.target.value})} placeholder="E.g., Oak Planks Box..." />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic font-sans">Description / Error Issue Details</label>
                                                        <textarea className="w-full bg-black/40 border border-white/5 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 transition-all text-white mt-1 resize-none" rows="3" value={orderForm.notes} onChange={e => setOrderForm({...orderForm, notes: e.target.value})} placeholder="Write details here..." />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic font-sans">Item / Invoice Photographic Check</label>
                                                        <div className="mt-1 flex items-center gap-4">
                                                            <div className="w-24 h-24 bg-black/50 border border-white/10 rounded-2xl overflow-hidden flex items-center justify-center">
                                                                {orderForm.photo ? <img src={orderForm.photo} className="w-full h-full object-cover" /> : <Icon name="camera" size={24} className="text-gray-600"/>}
                                                            </div>
                                                            <label className="px-6 py-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl cursor-pointer font-black text-xs uppercase tracking-widest transition-colors shadow-lg">
                                                                Upload Image
                                                                <input type="file" accept="image/*" className="hidden" onChange={handleOrderPhotoUpload} />
                                                            </label>
                                                        </div>
                                                    </div>
                                                    <button type="submit" className="w-full mt-8 py-6 bg-blue-600 hover:bg-blue-500 text-white rounded-3xl font-black uppercase tracking-[0.2em] text-sm shadow-xl active:scale-95 transition-all font-sans">Commit Registry</button>
                                                </form>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* 2. ANALYTICS View */}
                            {appMode === 'analytics' && !isLocked && (
                                 <div className="animate-in duration-500 font-sans">
                                    <div className="bg-[#1a1a1a]/90 backdrop-blur-xl rounded-[3rem] border border-white/10 shadow-2xl overflow-hidden font-sans">

                                            <table className="w-full text-left font-sans">
                                                <thead>

                                                        <th className="px-4 py-6 text-center text-[#ff8c00] font-sans">Yesterday</th>
