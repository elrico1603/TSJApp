                                                            <td className="px-4 py-6 text-center"><span className={`px-4 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest ${emp.isArchived ? 'bg-gray-500/10 text-gray-500 font-sans' : emp.status === 'In' ? 'bg-green-500/10 text-green-500 shadow-[0_0_10px_rgba(34,197,94,0.1)]' : emp.status === 'Break' ? 'bg-purple-500/10 text-purple-400' : 'bg-red-500/10 text-red-500'}`}>{emp.isArchived ? 'Archived' : emp.status}</span></td>
                                                            <td className="px-4 py-6 text-center font-mono font-black text-gray-400">{formatTime(calculateEmployeeHours(emp, 'yesterday'))}</td>
                                                            <td className="px-4 py-6 text-center font-mono font-black text-emerald-500">{formatTime(calculateEmployeeHours(emp, 'today'))}</td>
                                                            <td className="px-4 py-6 text-center font-mono font-black text-blue-500">{formatTime(getDailyCombinedRecords(emp, startDate, endDate).totalRangePaid)}</td>
                                                            <td className="px-4 py-6 text-center">
                                                                <div className="flex justify-center space-x-2">
                                                                    <button type="button" onClick={() => handleExportPDF(emp)} className="p-3 bg-blue-500/10 text-blue-500 rounded-xl hover:bg-blue-500 hover:text-white transition-all font-sans" title="Export as PDF"><Icon name="file-down" size={16}/></button>
                                                                    {!emp.isArchived && <button type="button" onClick={async () => { await db.collection('artifacts').doc(APP_ID_PATH).collection('public').doc('data').collection('employees').doc(emp.id).update({ todayHours: 0, weeklyHours: 0, monthlyHours: 0 }); announce(`${emp.name}'s current counters cleared.`); }} className="p-3 bg-red-500/10 text-red-500 rounded-xl hover:bg-red-500 hover:text-white transition-all font-sans" title="Reset Session Hours"><Icon name="refresh-cw" size={16}/></button>}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 3. STAFF REGISTRY (Admin Node) */}
                            {appMode === 'admin' && !isLocked && (
                                 <div className="animate-in p-4 font-sans font-sans">
                                    <div className="bg-[#1a1a1a]/90 backdrop-blur-xl rounded-[3rem] border border-white/10 shadow-2xl overflow-hidden p-8 font-sans">
                                        <div className="flex justify-between items-center mb-8 italic text-white font-sans font-sans">
                                            <h2 className="text-2xl font-black uppercase italic tracking-tighter">Employer Registration</h2>
                                            <button type="button" onClick={() => { setIsEditing(false); setShowEnrollModal(true); }} className="bg-[#ff8c00] text-white px-8 py-4 rounded-2xl font-black uppercase text-[11px] tracking-widest shadow-xl flex items-center space-x-3 active:scale-95 transition-all font-sans">

                                            {employees.map(emp => {

                                                return (
                                                <div key={emp.id} className={`bg-black/40 p-6 rounded-[2.5rem] border border-white/5 flex items-center justify-between group hover:border-blue-500/30 transition-all shadow-inner italic ${emp.isArchived ? 'opacity-50' : ''}`}>
                                                    <div className="flex items-center space-x-5 text-left font-sans">
                                                        <PhotoAvatar emp={emp} size={70} />
                                                        <div>
                                                            <h3 className="font-black italic uppercase text-white leading-none italic font-sans">{emp.name} {emp.surname}</h3>
                                                            <div className="flex items-center mt-2 space-x-2">
                                                                <p className="text-[10px] text-blue-500 font-black uppercase">{emp.role}</p>
                                                                <span className={`px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-widest ${emp.isArchived ? 'bg-red-500/20 text-red-500 font-sans' : 'bg-emerald-500/20 text-emerald-500 font-sans'}`}>
                                                                    {emp.isArchived ? 'Inactive' : 'Active'}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="flex flex-col gap-3 font-sans font-sans">
                                                        <div className="flex items-center gap-2">
                                                            <button type="button" onClick={() => openEditor(emp)} className="p-3 text-white/20 hover:text-blue-500 transition-all active:scale-90 font-sans" title="Edit Profile"><Icon name="edit-3" size={20}/></button>
                                                        </div>
                                                    </div>
                                                </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>

                    {/* VIEW: AUTO SCANNER */}
                    {view === 'scanning' && selectedEmployee && (
                       <div className="fixed inset-0 z-[150] bg-black/98 flex flex-col items-center justify-center p-4 md:p-12 animate-in zoom-in font-sans">
                           <div className="w-full max-w-2xl aspect-square relative rounded-[3rem] md:rounded-[5rem] overflow-hidden border-[10px] md:border-[20px] border-[#222] shadow-[0_0_150px_rgba(255,140,0,0.15)]">
                               <video ref={videoRef} autoPlay playsInline muted className="absolute inset-0 w-full h-full object-cover grayscale opacity-100 contrast-125 scale-x-[-1]" />
                               <div className="absolute inset-0 flex flex-col items-center justify-center p-4 md:p-10">
                                   <div className={`w-3/4 aspect-square border-4 rounded-[3rem] md:rounded-[5rem] transition-all duration-700 ${scanComplete ? 'border-emerald-500 scale-105 shadow-[0_0_100px_rgba(16,185,129,0.3)]' : 'border-[#ff8c00] animate-pulse'}`}>
                                       <div className="absolute inset-0 opacity-10 flex items-center justify-center"><Icon name="fingerprint" size={150}/></div>
                                       {!scanComplete && <div className="absolute w-full h-2 bg-[#ff8c00] top-0 animate-[scan_2s_linear_infinite] shadow-[0_0_50px_#ff8c00]" />}
                                   </div>
                               </div>
                           </div>
                           <h3 className="mt-8 md:mt-12 text-[#ff8c00] font-black uppercase text-lg md:text-2xl tracking-[0.4em] md:tracking-[0.8em] animate-pulse italic text-center font-sans">Scanning identity: {selectedEmployee.name}</h3>
                           <button onClick={() => setView('emp_home')} className="mt-6 md:mt-8 text-gray-600 font-black uppercase text-xs hover:text-white transition-colors italic underline underline-offset-8 font-sans">Abort Sequence</button>
                       </div>
                    )}

                    {/* VIEW: PERSONAL PIN ENTRY */}
                    {view === 'personal_pin_entry' && selectedEmployee && (
                       <div className="fixed inset-0 z-[200] bg-[#0c0c0c] flex flex-col items-center justify-center animate-in slide-in-from-bottom-20 font-sans font-sans">
                           <div className="bg-[#151515] p-12 rounded-[5rem] border border-white/10 text-center w-full max-w-sm shadow-[0_50px_100px_rgba(0,0,0,0.8)]">
                               <div className={`p-6 rounded-full mb-8 mx-auto w-fit ${personalPinError ? 'bg-red-500/20 text-red-500 animate-shake font-sans' : 'bg-blue-500/10 text-blue-500 shadow-xl shadow-blue-500/10 font-sans'}`}>
                                   <Icon name="key-round" size={60} />
                               </div>
                               <h2 className="text-2xl font-black uppercase italic tracking-tighter mb-1 text-white italic text-center">Authorization Check</h2>
                               <p className="text-gray-500 text-[11px] font-black uppercase mb-12 tracking-widest italic">{selectedEmployee.name} {selectedEmployee.surname}</p>
                               <div className="flex justify-center space-x-6 mb-16 font-sans">
                                   {[1,2,3,4].map(i => <div key={i} className={`h-4 w-4 rounded-full transition-all duration-300 ${personalPinInput.length >= i ? (personalPinError ? 'bg-red-500 font-sans font-bold' : 'bg-blue-500 shadow-[0_0_20px_#3b82f6] font-sans font-bold') : 'bg-white/5'}`} />)}
                               </div>
                               <div className="grid grid-cols-3 gap-4 mb-4 font-sans font-sans font-bold font-sans">
                                   {[1, 2, 3, 4, 5, 6, 7, 8, 9, 'C', 0, 'X'].map(n => (
                                       <button type="button" key={n} onClick={() => {
                                           if (n === 'X') {
                                               setView('dashboard');
                                               setSelectedEmployee(null);
                                               setPendingAction('normal');
                                               setPersonalPinInput('');
                                           } else if (n === 'C') {
                                               setPersonalPinInput('');
                                           } else {
                                               handlePersonalPinDigit(n.toString());
                                           }
                                       }} className="h-16 bg-white/5 rounded-2xl flex items-center justify-center text-2xl font-black text-white transition-all active:bg-blue-600 font-sans font-sans font-bold">{n}</button>
                                   ))}
                               </div>
                               <button type="button" onClick={submitPersonalPin} disabled={personalPinInput.length !== 4} className={`w-full h-16 rounded-2xl flex items-center justify-center text-2xl font-black transition-all ${personalPinInput.length === 4 ? 'bg-blue-600 text-white shadow-xl font-bold font-sans' : 'bg-white/5 text-gray-600'}`}>OK</button>
                           </div>
                       </div>
                    )}

                    {/* VIEW: SUPERVISOR APPROVAL FOR TIME OFF, ADVANCES & ARCHIVE */}
                    {view === 'supervisor_approval' && selectedEmployee && (
                       <div className="fixed inset-0 z-[200] bg-[#0c0c0c] flex flex-col items-center justify-center animate-in slide-in-from-bottom-20 italic font-sans font-sans">
                           <div className={`bg-[#151515] p-12 rounded-[5rem] border ${pendingAction === 'borrow_money' ? 'border-emerald-500/30' : pendingAction === 'archive' ? 'border-red-500/30' : 'border-purple-500/30'} text-center w-full max-w-sm shadow-[0_50px_100px_rgba(0,0,0,0.8)]`}>
                               <div className={`p-6 rounded-full mb-8 mx-auto w-fit italic ${supervisorApprovalPinError ? 'bg-red-500/20 text-red-500 animate-shake font-sans' : pendingAction === 'borrow_money' ? 'bg-emerald-500/10 text-emerald-500 shadow-xl shadow-emerald-500/10' : pendingAction === 'archive' ? 'bg-red-500/10 text-red-500 shadow-xl shadow-red-500/10' : 'bg-purple-500/10 text-purple-500 shadow-xl shadow-purple-500/10 font-sans font-sans'}`}>
                                   <Icon name="lock" size={60} />
                               </div>
                               <h2 className="text-2xl font-black uppercase italic tracking-tighter mb-1 text-white italic text-center font-sans font-sans">Supervisor Approval</h2>
                               <p className="text-gray-500 text-[11px] font-black uppercase mb-12 tracking-widest italic font-sans">{pendingAction === 'borrow_money' ? 'Money Borrowed:' : pendingAction === 'archive' ? 'Archive Profile:' : 'Time Off:'} {selectedEmployee.name} {selectedEmployee.surname}</p>
                               
                               <form onSubmit={(e) => { e.preventDefault(); submitSupervisorPin(); }} className="space-y-6">
                                   <input 
                                       type="password"
                                       placeholder="Enter supervisor key..."
                                       value={supervisorApprovalPinInput}
                                       onChange={(e) => setSupervisorApprovalPinInput(e.target.value)}
                                       className="w-full bg-black/40 border border-white/10 rounded-2xl p-4 text-center text-white text-lg font-bold font-sans outline-none focus:border-blue-500"
                                       autoFocus
                                   />
                                   <div className="flex gap-4">
                                       <button type="button" onClick={() => { setView(pendingAction === 'borrow_money' ? 'emp_money_borrowed' : pendingAction === 'archive' ? 'emp_home' : 'emp_time_off'); setSupervisorApprovalPinInput(''); }} className="flex-1 py-4 bg-white/5 hover:bg-white/10 rounded-2xl text-xs font-black uppercase tracking-widest text-white">Cancel</button>
                                       <button type="submit" className="flex-1 py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl text-xs font-black uppercase tracking-widest text-white shadow-xl font-sans font-sans">OK</button>
                                   </div>
                               </form>
                               {supervisorApprovalPinError && <p className="mt-4 text-red-500 text-[10px] font-black uppercase animate-pulse italic font-sans font-bold">Authorization Denied</p>}
                           </div>
                       </div>
                    )}

                    {/* VIEW: SUCCESS SCREEN */}
                    {view === 'success_screen' && selectedEmployee && (
                         <div className="fixed inset-0 z-[500] bg-black/95 flex flex-col items-center justify-center p-12 text-center animate-in fade-in font-sans font-sans font-sans">
                            <div className={`w-64 h-64 rounded-full border-[15px] p-2 shadow-2xl mb-12 overflow-hidden ${lastClockResult === 'In' ? 'border-emerald-500 shadow-emerald-500/30' : lastClockResult === 'HR_Request' ? 'border-emerald-500 shadow-emerald-500/30' : lastClockResult === 'Break' ? 'border-purple-500 shadow-purple-500/30' : 'border-red-500 shadow-red-500/30'}`}>
                                <PhotoAvatar emp={selectedEmployee} size="100%" className="border-0 rounded-full shadow-none" />
                            </div>
                            <h2 className="text-6xl md:text-8xl font-black italic uppercase tracking-tighter text-white mb-4 leading-none italic text-center font-sans font-sans">
                                {lastClockResult === 'HR_Request' ? 'SENT TO HR' : lastClockResult === 'Archive' ? 'PROFILE ARCHIVED' : 'IDENTITY VERIFIED'}
                            </h2>
                            {lastClockResult === 'HR_Request' && <p className="text-emerald-500 font-bold uppercase tracking-widest text-xl mb-6 font-sans">Your request has been send through to HR.</p>}
                            <p className="text-3xl font-black text-gray-500 uppercase tracking-widest mb-16 italic font-sans font-sans font-sans font-sans">{selectedEmployee.name} {selectedEmployee.surname}</p>
                            
                            <button 
                                onClick={() => {
                                    setView('dashboard'); 
                                    setSelectedEmployee(null); 
                                    setScanComplete(false); 
                                    setPendingAction('normal'); 
                                    setTimeOffReason('');
                                    setLastClockResult(null); 
                                }}
                                className={`bg-[#151515] w-full max-w-md p-14 rounded-[5rem] text-center border-b-[16px] shadow-2xl active:scale-95 transition-all ${lastClockResult === 'In' || lastClockResult === 'HR_Request' ? 'border-emerald-500 hover:bg-emerald-900/20' : lastClockResult === 'Break' ? 'border-purple-500 hover:bg-purple-900/20' : 'border-red-500 hover:bg-red-900/20'}`}
                            >
                               <p className={`font-mono font-black italic uppercase leading-none tracking-tighter ${lastClockResult === 'HR_Request' ? 'text-4xl md:text-5xl' : 'text-6xl md:text-8xl'} ${lastClockResult === 'In' || lastClockResult === 'HR_Request' ? 'text-emerald-500' : lastClockResult === 'Break' ? 'text-purple-500' : 'text-red-500'}`}>
                                   {lastClockResult === 'In' ? 'IN' : lastClockResult === 'Break' ? 'TIME OFF' : lastClockResult === 'HR_Request' ? 'RETURN TO HOME' : lastClockResult === 'Archive' ? 'ARCHIVED' : 'OUT'}
                               </p>
                            </button>
                         </div>
                    )}
                </div>

                {/* --- HARDCOPY PDF EXPORT ENGINE OVERLAY --- */}
                {printingEmployee && (
                    <div className="print-wrapper fixed inset-0 z-[9999] min-h-screen overflow-y-auto bg-white py-10 flex flex-col items-center not-italic font-sans animate-in duration-300 font-sans font-sans">
                        <div className="no-print bg-blue-100 text-blue-800 p-3 text-center text-sm font-bold mb-6 rounded-lg border border-blue-200 max-w-2xl w-full font-sans font-sans">
                            💡 Hint: Print this page using your browser. Select A4 and disable margins for the best result.
                        </div>
                        <div id="pdf-export-container" className="bg-white text-black p-12 font-sans w-full max-w-4xl">
                            <div className="border-b-2 border-black pb-6 mb-8 flex justify-between items-end avoid-break font-sans">
                                <div>
                                    <h1 className="text-4xl font-black uppercase tracking-tighter font-sans">TimberSmith Joinery</h1>
                                    <p className="text-sm font-bold uppercase tracking-widest text-gray-500 mt-1 font-sans font-sans">Labor Summary Record</p>
                                </div>
                                <div className="text-right font-sans font-bold">
                                    <p className="font-bold font-sans">Date Printed: {new Date().toLocaleDateString()}</p>
                                    <p className="text-sm font-bold text-red-600 font-sans">Period: {startDate} to {endDate} ({Math.round(((new Date(endDate) - new Date(startDate)) / (1000 * 60 * 60 * 24) + 1) / 7)} Weeks)</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-8 mb-8 border border-gray-300 p-6 rounded-2xl avoid-break font-sans font-sans">
                                <div>
                                    <p className="text-xs font-bold uppercase text-gray-500 font-sans">Artisan Details</p>
                                    <p className="text-2xl font-black uppercase mt-1 font-sans">{printingEmployee.name} {printingEmployee.surname}</p>
                                    <p className="text-sm font-bold mt-1 text-blue-600 font-sans">{printingEmployee.role} {printingEmployee.isArchived && <span className="text-red-500 ml-2 font-sans">(ARCHIVED)</span>}</p>
                                </div>
                                <div>
                                    <p className="text-xs font-bold uppercase text-gray-500 mb-2 font-sans">Identification</p>
                                    <p className="text-sm font-sans font-bold"><strong>ID Number:</strong> {printingEmployee.idNumber || 'N/A'}</p>
                                    <p className="text-sm font-sans font-bold"><strong>Contact:</strong> {printingEmployee.contactNumber || 'N/A'}</p>
                                </div>
                            </div>

                            <div className="mb-8 avoid-break font-sans">
                                <h3 className="text-lg font-black uppercase mb-4 border-b border-gray-200 pb-2 font-sans">Hours Verification Summary</h3>
                                {(() => {
                                    const { totalRangePaid } = getDailyCombinedRecords(printingEmployee, startDate, endDate);
                                    return (
                                        <div className="grid grid-cols-3 gap-6 font-sans">
                                            {/* First: Bargaining Council */}
                                            <div className="bg-gray-100 p-4 rounded-xl text-center flex flex-col justify-center">
                                                <p className="text-xs font-bold uppercase text-gray-500 font-sans">Bargaining Council</p>
                                                <p className="text-xs font-black text-orange-600 mt-2 leading-relaxed font-sans">
                                                    4 WEEKS = 176 HOURS<br/>
                                                    5 WEEKS = 220 HOURS
                                                </p>
                                            </div>
                                            {/* Second: Selected Range Total */}
                                            <div className="bg-gray-100 p-4 rounded-xl text-center flex flex-col justify-center">
                                                <p className="text-xs font-bold uppercase text-gray-500 font-sans">Selected Range Total</p>
                                                <p className="text-3xl font-black text-blue-600 mt-2 font-sans">{formatTime(totalRangePaid)}</p>
                                                <p className="text-[9px] text-gray-400 font-bold mt-1 uppercase font-sans">Deductions Applied</p>
                                            </div>
                                            {/* Third: Standard Daily Breaks */}
                                            <div className="bg-gray-100 p-4 rounded-xl text-center flex flex-col justify-center">
                                                <p className="text-xs font-bold uppercase text-gray-500 font-sans">Standard Daily Breaks</p>
                                                <div className="text-xs font-black text-purple-700 uppercase mt-2 leading-relaxed font-sans">
                                                    Tea 1: 15 min<br />
                                                    Lunch: 30 min<br />
                                                    Tea 2: 15 min
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>

                            {/* Section 1: Itemized Shift & Clocking History */}
                            <div className="mb-8 font-sans font-sans">
                                <h3 className="text-lg font-black uppercase mb-4 border-b border-gray-200 pb-2 avoid-break">Itemized Shift & Clocking History</h3>
                                <table className="w-full text-left border-collapse font-sans font-sans">
                                    <thead>
                                        <tr className="bg-gray-100 text-xs uppercase tracking-widest avoid-break" style={{ pageBreakInside: 'avoid', breakInside: 'avoid' }}>
                                            <th className="p-3 border border-gray-300 font-bold">Date</th>
                                            <th className="p-3 border border-gray-300 font-bold text-center font-sans">Clock In</th>
                                            <th className="p-3 border border-gray-300 font-bold text-center font-sans">Clock Out</th>
                                            <th className="p-3 border border-gray-300 font-bold text-center font-sans">Total Hours</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {(() => {
                                            const { sortedDays } = getDailyCombinedRecords(printingEmployee, startDate, endDate);

                                            if (sortedDays.length === 0) {
                                                return (
                                                    <tr className="avoid-break font-sans font-sans" style={{ pageBreakInside: 'avoid', breakInside: 'avoid' }}>
                                                        <td colSpan="4" className="p-4 text-center text-gray-500 font-bold font-sans font-sans">No labor hours recorded in the selected period.</td>
                                                    </tr>
                                                );
                                            }

                                            return sortedDays.map((item, i) => {
                                                const holidayName = SA_HOLIDAYS[item.date];
                                                const dayAbbr = getDayAbbreviation(item.date);
                                                const isHoliday = !!holidayName;

                                                return (
                                                    <tr key={i} className={`avoid-break font-sans font-sans ${isHoliday ? 'bg-red-50/30' : ''}`} style={{ pageBreakInside: 'avoid', breakInside: 'avoid' }}>

                                    </tbody>
                                </table>
                            </div>

                            {/* Section 3: Time Off & Breaks History */}
                            <div className="mb-8 font-sans font-sans">

                                            <th className="p-3 border border-gray-300 font-bold text-center">Departure (Left)</th>
                                            <th className="p-3 border border-gray-300 font-bold text-center">Return (Returned)</th>

                                            </tr>

                                        {(!printingEmployee.breaks || printingEmployee.breaks.filter(b => b.date >= startDate && b.date <= endDate).length === 0) && (
                                            <tr className="avoid-break font-sans" style={{ pageBreakInside: 'avoid', breakInside: 'avoid' }}><td colSpan="4" className="p-4 text-center text-gray-500 font-bold font-sans">No time off or breaks recorded in the selected period.</td></tr>

                                                 <tr><td className="border-b-2 border-black p-3 bg-[#fff2cc] border-r-2 font-sans font-sans font-bold">ORDER QTY</td><td className="border-b-2 border-black p-3 bg-[#fff2cc] text-red-600 text-lg font-sans font-sans">{printingCard.orderQty}</td></tr>
                                                 <tr><td className="p-3 border-r-2 font-sans">DELIVERY TIME</td><td className="p-3 font-sans font-sans">{printingCard.deliveryTime}</td></tr>
                                             </tbody>

                                    </div>
                                </div>

                                         </div>
                                         <div className="w-full mt-2 border-2 border-black p-1 text-center font-black text-xs uppercase font-sans font-sans" style={{ backgroundColor: printingCard.color || '#d9ead3' }}>

                                         </div>

                                                 <tr><td className="border-b-2 border-black p-3 border-r-2 font-sans font-sans">SUPPLIER</td><td className="border-b-2 border-black p-3 font-sans font-sans">{printingCard.supplier}</td></tr>
                                                 <tr><td className="border-b-2 border-black p-3 bg-[#fff2cc] border-r-2 font-sans font-sans">ORDER QTY</td><td className="border-b-2 border-black p-3 bg-[#fff2cc] text-red-600 text-lg font-sans font-sans">{printingCard.orderQty}</td></tr>
                                                 <tr><td className="p-3 border-r-2 font-sans font-sans">DELIVERY TIME</td><td className="p-3 font-sans font-sans">{printingCard.deliveryTime}</td></tr>

                            </div>

                            {/* PART 3: BACK CARD (PULLED) */}

                {showEnrollModal && (

                            <div className="flex-1 overflow-y-auto p-12 custom-scrollbar text-white italic text-left font-sans">

                                        <div className="space-y-2 text-left font-sans"><label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic font-sans font-bold font-sans">ID Number</label><input required className="w-full bg-black/40 border border-white/5 rounded-2xl p-5 font-mono text-white font-sans font-sans" value={enrollForm.idNumber} onChange={e => setEnrollForm({...enrollForm, idNumber: e.target.value})} /></div>
                                        <div className="space-y-2 text-left font-sans"><label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic font-sans font-bold font-sans">Contact No</label><input required className="w-full bg-black/40 border border-white/5 rounded-2xl p-5 font-bold text-white font-sans font-sans" value={enrollForm.contactNumber} onChange={e => setEnrollForm({...enrollForm, contactNumber: e.target.value})} /></div>
                                        <div className="space-y-2 text-left font-sans"><label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic font-sans font-bold font-sans">Tax Number</label><input required className="w-full bg-black/40 border border-white/5 rounded-2xl p-5 font-bold text-white font-sans font-sans" value={enrollForm.taxNumber} onChange={e => setEnrollForm({...enrollForm, taxNumber: e.target.value})} /></div>
                                        <div className="space-y-2 text-left font-sans"><label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic font-sans font-bold font-sans">UIF Number</label><input required className="w-full bg-black/40 border border-white/5 rounded-2xl p-5 font-bold text-white font-sans font-sans" value={enrollForm.uifNumber} onChange={e => setEnrollForm({...enrollForm, uifNumber: e.target.value})} /></div>
                                        
                                        {/* REPLACED HOURLY RATE WITH EMPLOYMENT START DATE */}
                                        <div className="space-y-2 text-left font-sans">
                                            <label className="text-[10px] font-black uppercase text-gray-600 ml-4 italic font-sans font-bold font-sans">Employment Date Started</label>
                                            <input required type="date" className="w-full bg-black/40 border border-white/5 rounded-2xl p-5 font-bold outline-none focus:border-blue-500 transition-all text-white font-sans font-sans" value={enrollForm.dateStarted || ''} onChange={e => setEnrollForm({...enrollForm, dateStarted: e.target.value})} />
                                        </div>

                                        <div className="col-span-2 space-y-2 mt-4 text-left font-sans font-sans">
                                            <label className="text-[11px] font-black uppercase text-orange-500 ml-4 tracking-widest italic font-sans font-bold font-sans">Secret Terminal PIN (4 Digits)</label>
                                            <input required className="w-full bg-black border-2 border-orange-500/20 rounded-3xl p-6 text-center text-4xl font-black text-orange-500 tracking-[0.5em] font-sans" maxLength="4" value={enrollForm.personalCode} onChange={e => setEnrollForm({...enrollForm, personalCode: e.target.value})} />
                                        </div>
                                        <button type="submit" className="col-span-2 mt-8 py-8 bg-white text-black rounded-[3rem] font-black uppercase tracking-[0.4em] text-sm shadow-2xl active:scale-95 transition-all italic font-sans font-sans">{isEditing ? 'Save Changes' : 'Commit Enrollment'}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                )}

                {/* DELETE SECURITY MODAL */}
                {showDeleteModal && (
                    <div className="fixed inset-0 z-[1200] bg-black/95 backdrop-blur-2xl flex items-center justify-center p-6 animate-in fade-in font-sans font-sans">
                        <div className="bg-[#151515] p-12 rounded-[5rem] text-center border-2 border-red-500/20 w-full max-w-sm shadow-2xl font-sans">
                            <div className="p-6 bg-red-500/10 text-red-500 rounded-full w-fit mx-auto mb-8 shadow-inner font-sans"><Icon name="shield-alert" size={54} /></div>
                            <h3 className="text-xl font-black uppercase italic text-white mb-2 italic font-sans">Authorize Removal</h3>
                            <p className="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500 mb-10 italic font-sans">Deleting Profile: {targetDelete?.name}</p>
                            <form onSubmit={handleDeleteConfirm} className="font-sans">
                                <input type="password" autoFocus placeholder="Enter Super PIN" className="w-full bg-black border border-white/10 rounded-2xl p-6 text-center text-3xl font-mono tracking-[0.5em] mb-8 outline-none focus:border-red-500 transition-all text-white italic font-sans" value={superPinInput} onChange={e => setSuperPinInput(e.target.value)} />
                                <div className="flex gap-4 font-sans font-sans">
                                    <button type="button" onClick={() => setShowDeleteModal(false)} className="flex-1 py-5 bg-white/5 rounded-2xl font-black uppercase text-[10px] tracking-widest text-white italic font-sans">Cancel</button>
                                    <button type="submit" className="flex-1 py-5 bg-red-600 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-xl text-white italic font-sans">Confirm Delete</button>
                                </div>
                            </form>
                            {superPinError && <p className="mt-6 text-red-500 text-[10px] font-black uppercase animate-pulse italic font-sans">Authorization Denied</p>}
                        </div>
                    </div>
                )}

                </Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TimberSmithApp />);
    </script>
</body>
</html>
